# ローカル開発・動作確認用のPostgreSQL（docs/CICD.md §7）。
# 起動: docker compose up -d db  / 停止: docker compose stop db
services:
  db:
    image: postgres:16-alpine
    container_name: work-manager-db
    environment:
      POSTGRES_USER: workmanager
      POSTGRES_PASSWORD: workmanager-local # ローカル専用。本番では使用しない
      POSTGRES_DB: work_manager
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workmanager -d work_manager"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
