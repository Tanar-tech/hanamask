appId: dev.tanar.hanamask
productName: hanamask
copyright: Copyright © 2026 Tanar

directories:
  output: release

# node_modules の本番依存は electron-builder が自動で同梱するため列挙しない。
files:
  - dist/**
  - package.json
  # react/react-dom/mermaid はレンダラーのバンドル(dist/renderer)に取り込み済みで、
  # 実行時に node_modules から解決されることはない。
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/mermaid/**"
  # 同梱するのはCPU版のバイナリだけにする。GPU版は数百MBある上に、使わないコードを
  # 配布物へ持ち込むと攻撃面が広がるだけになる（SPEC セキュリティ要件 S8）。
  - "!node_modules/@node-llama-cpp/win-x64-cuda*/**"
  - "!node_modules/@node-llama-cpp/win-x64-vulkan/**"
  # 対象は x64 のみ。arm64 のプリビルド（約22MB）は使われない。
  - "!node_modules/@node-llama-cpp/win-arm64/**"
  # llama.cpp のソースを丸ごと含む git bundle。実行には使わない。
  - "!node_modules/node-llama-cpp/llama/gitRelease.bundle"

# ネイティブアドオンは .node を asar 内から dlopen できないため展開して同梱する。
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/@node-llama-cpp/**"
  - "**/node_modules/node-llama-cpp/bins/**"

# GGUF は asar 内から mmap できないため、asar の外（resources/models）へ置く。
extraResources:
  - from: resources/models
    to: models
    filter:
      - embedding.json
      - "*.gguf"
      - "*.LICENSE"

win:
  target:
    - nsis
  # 既定の "hanamask Setup 0.1.0.exe" は空白を含む。GitHub Releases は添付時に空白を
  # ドットへ置換する一方、latest.yml（自動更新のフィード）はハイフンで書き出すため、
  # 3者の名前が食い違って自動更新が対象を見つけられなくなる。空白を使わせない。
  artifactName: ${name}-Setup-${version}.${ext}
  # 既定のElectronアイコンだとタスクバーで他のElectronアプリと見分けが付かない。
  # 意匠は承認済みのデザイントークンに合わせ、アクア（利用者）とピンク（エージェント）が
  # 重なる形にしている。build/generate-icon.py で再生成できる。
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# 自動更新のフィード（latest.yml）を生成させるための宣言。
# CIは --publish never 相当（gh CLIで明示アップロード）で動かすため、
# electron-builder 自身がここへアップロードすることはない。
publish:
  provider: github
  owner: Tanar-tech
  repo: hanamask
