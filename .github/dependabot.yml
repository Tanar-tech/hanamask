version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # 公開直後のバージョンには、乗っ取られたパッケージが紛れることがある。
    # 一定期間寝かせてから取り込む（supply chain対策）。
    cooldown:
      default-days: 7
      semver-major-days: 30
    # 依存の大幅な変更は管理者承認が必要（docs/GOVERNANCE.md §6）。
    # まとめて1本にすることでレビューの単位を粗くし、PRの氾濫を防ぐ。
    groups:
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
      # electron は devDependencies にあるが、electron-builder が配布物へ同梱する
      # ランタイムそのもの。development に混ぜると「開発だけだから安全」と読まれ、
      # 利用者が実行するランタイムが黙って変わる。本番と同じ扱いにするため分ける。
      production-runtime:
        patterns: ["electron"]
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        exclude-patterns: ["electron"]
        update-types: ["minor", "patch"]
    # Electronのメジャー更新はネイティブモジュール(better-sqlite3)の再ビルドと
    # 動作確認を伴うため、自動PRにせず手元で計画的に上げる。
    ignore:
      - dependency-name: electron
        update-types: ["version-update:semver-major"]

  # ワークフローのアクションはSHAで固定しているため、更新はDependabot経由でしか来ない。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # グループを定義しないと dependency-group が空になり、自動マージの条件から
    # 一律に外れて手動待ちで溜まる（2026-08-19、PR #172 で実測）。
    # アクションはCIとリリースの実行環境そのものだが、SHA固定で差分が読みやすく、
    # 必須チェックが揃わなければマージされないため、マイナー以下は自動で取り込む。
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
