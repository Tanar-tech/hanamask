name: CI

# 以前は docs/** と *.md を paths-ignore で除外していたが、2026-08-18 のブランチ保護で
# build-and-test と semgrep を必須チェックにしたため、除外されたPRは3件が永久に揃わず
# BLOCKED のままになった（管理者も enforce_admins: true で回避できない）。
# ドキュメントだけの変更でもCIを回して、必須チェックが必ず報告される状態にする。
on:
  pull_request:
    branches: [main, "feature/**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # 配布対象は Windows なのに、CI は ubuntu でしか回っていなかった。
    # 0.2.0 のリリースで初めて Windows 上でテストが走り、パス区切りを直書きした
    # アサーションが落ちた。同種の不具合をPRの時点で捕まえるため両方で回す。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # 公開リポジトリとして配布するため、同梱される依存に強いコピーレフトが
      # 混ざっていないことを機械的に確かめる。Apache-2.0 の成果物に GPL/AGPL を
      # 取り込むと配布条件が変わってしまう（docs/TASKS.md T38）。
      # ライセンスはOSに依らないので1つの環境でだけ確認する。
      - name: 依存ライセンスを確認する
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:licenses

      # READMEのMCPツール一覧は利用者から見える唯一の一覧。実装とずれると
      # 「載っていないから無い」と誤解される。OSに依らないので1つの環境で確認する。
      - name: READMEのツール一覧を確認する
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:readme

      # E2EはMCP経由の書き込みが画面へ反映されることを検証する唯一の層。
      # CIで走らせていなかった間に update_note が本文を保存しない回帰が入り、
      # 単体テスト633件が緑のまま2日間気付かれなかった。
      # Electronの描画にディスプレイが要るのでLinuxでのみ xvfb 配下で回す。
      - name: E2E
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:e2e

      - name: E2Eのスクリーンショットを残す
        if: matrix.os == 'ubuntu-latest' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: tests/e2e/.artifacts/
          if-no-files-found: ignore
