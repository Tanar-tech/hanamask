name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: &non_functional_paths
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
  push:
    branches: [main]
    paths-ignore: *non_functional_paths

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # 公開リポジトリとして配布するため、同梱される依存に強いコピーレフトが
      # 混ざっていないことを機械的に確かめる。Apache-2.0 の成果物に GPL/AGPL を
      # 取り込むと配布条件が変わってしまう（docs/TASKS.md T38）。
      - name: 依存ライセンスを確認する
        run: npm run check:licenses
