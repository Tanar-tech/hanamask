name: PR Preview

# PRごとのプレビュー環境（docs/AWS.md「PRプレビュー環境」、docs/GOVERNANCE.md §3）。
# opened/synchronize/reopened → プレビューをデプロイしURLをPRにコメント。
# closed → スタックを破棄しpr_<番号>スキーマをDROPする。
#
# 単一Aurora内のスキーマ pr_<PR番号> にPRごとのデータを分離する。共有情報（VPC/Aurora/SG/
# ワイルドカード証明書）はWebAppStack/DomainStackのdescribe-stacks出力から取得し、CDKコンテキスト
# としてPreviewStackへ渡す。認証はGitHub OIDC（release.ymlと同じ hanamask-github-deploy ロール）。
#
# 前提（初回のみ・管理者）: 本ブランチのWebAppStack/DomainStack/GithubDeployStack更新を本番へ反映
# （Deployワークフロー実行 + GithubDeployStack再デプロイ）しておくこと。

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"

permissions:
  contents: read
  id-token: write # OIDC
  pull-requests: write # URLコメント

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (frontend / API / migration bundles)
        run: |
          npm run build
          npm run build:lambda
          npm run build:migrate

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read shared stack outputs
        id: shared
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$1" --region "$2" \
            --query "Stacks[0].Outputs[?OutputKey=='$3'].OutputValue" --output text; }
          {
            echo "vpcId=$(get HanamaskWebAppStack "$AWS_REGION" SharedVpcId)"
            echo "subnets=$(get HanamaskWebAppStack "$AWS_REGION" SharedIsolatedSubnetIds)"
            echo "azs=$(get HanamaskWebAppStack "$AWS_REGION" SharedAvailabilityZones)"
            echo "sgId=$(get HanamaskWebAppStack "$AWS_REGION" SharedPreviewLambdaSgId)"
            echo "dbEndpoint=$(get HanamaskWebAppStack "$AWS_REGION" SharedDbEndpoint)"
            echo "dbSecretArn=$(get HanamaskWebAppStack "$AWS_REGION" SharedDbSecretArn)"
            echo "certArn=$(get HanamaskDomainStack us-east-1 PreviewCertificateArn)"
          } >> "$GITHUB_OUTPUT"

      # --hotswap-fallback は一時的に無効化中（2026-07-28）: GithubDeployRoleに
      # cloudformation:GetTemplate等の追加権限が必要だが未反映のためAccessDeniedで
      # デプロイ自体が失敗する（fix/hotswap-preview-iam-permissions PR #14で権限追加済み、
      # 管理者によるGithubDeployStack再デプロイ待ち）。反映後はこのコメントごと
      # `--hotswap-fallback \` の行を復元すること。
      - name: CDK deploy preview stack
        working-directory: infra
        run: |
          npx cdk deploy "HanamaskPreviewStack-pr-${PR_NUMBER}" --require-approval never \
            -c prNumber="${PR_NUMBER}" \
            -c vpcId="${{ steps.shared.outputs.vpcId }}" \
            -c isolatedSubnetIds="${{ steps.shared.outputs.subnets }}" \
            -c availabilityZones="${{ steps.shared.outputs.azs }}" \
            -c previewLambdaSgId="${{ steps.shared.outputs.sgId }}" \
            -c dbEndpoint="${{ steps.shared.outputs.dbEndpoint }}" \
            -c dbSecretArn="${{ steps.shared.outputs.dbSecretArn }}" \
            -c previewCertArn="${{ steps.shared.outputs.certArn }}"

      - name: Run migrations and seed (create schema + migrate deploy + seed data)
        run: |
          set -euo pipefail
          RESPONSE=$(aws lambda invoke \
            --function-name "hanamask-migrate-pr-${PR_NUMBER}" \
            --cli-read-timeout 350 \
            --cli-binary-format raw-in-base64-out \
            --payload '{"seed":true}' \
            migrate-output.json)
          echo "$RESPONSE"
          echo "--- migration output ---"
          cat migrate-output.json; echo ""
          if echo "$RESPONSE" | grep -q "FunctionError"; then
            echo "::error::プレビューDBマイグレーション/シードに失敗しました"
            exit 1
          fi

      - name: Comment preview URL with demo user credentials
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${PR_NUMBER}" --body "🚀 プレビュー環境を用意しました

          **URL:** https://pr-${PR_NUMBER}.preview.dev.takudon3.com

          **デモユーザー（シード済み）**
          - Email: admin@example.com
          - Password: password123
          - 組織・プロジェクト・タスク履歴が投入されています

          > このPRのコードが専用環境で動作します。DBは単一Auroraの \\\`pr_${PR_NUMBER}\\\` スキーマに分離。PRをクローズすると自動で破棄されます。"

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # destroyのsynthにLambdaアセットが必要。フロント(out/)はBucketDeploymentが条件付きのため不要。
      - name: Build Lambda bundles (for destroy synth)
        run: |
          npm run build:lambda
          npm run build:migrate

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Drop preview schema
        run: |
          set -euo pipefail
          RESPONSE=$(aws lambda invoke \
            --function-name hanamask-drop-schema \
            --cli-read-timeout 150 \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"schema\":\"pr_${PR_NUMBER}\"}" \
            drop-output.json)
          echo "$RESPONSE"; cat drop-output.json; echo ""
          if echo "$RESPONSE" | grep -q "FunctionError"; then
            echo "::warning::スキーマ削除に失敗しました（スタック破棄は継続します）"
          fi

      - name: Read shared stack outputs
        id: shared
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$1" --region "$2" \
            --query "Stacks[0].Outputs[?OutputKey=='$3'].OutputValue" --output text; }
          {
            echo "vpcId=$(get HanamaskWebAppStack "$AWS_REGION" SharedVpcId)"
            echo "subnets=$(get HanamaskWebAppStack "$AWS_REGION" SharedIsolatedSubnetIds)"
            echo "azs=$(get HanamaskWebAppStack "$AWS_REGION" SharedAvailabilityZones)"
            echo "sgId=$(get HanamaskWebAppStack "$AWS_REGION" SharedPreviewLambdaSgId)"
            echo "dbEndpoint=$(get HanamaskWebAppStack "$AWS_REGION" SharedDbEndpoint)"
            echo "dbSecretArn=$(get HanamaskWebAppStack "$AWS_REGION" SharedDbSecretArn)"
            echo "certArn=$(get HanamaskDomainStack us-east-1 PreviewCertificateArn)"
          } >> "$GITHUB_OUTPUT"

      - name: CDK destroy preview stack
        working-directory: infra
        run: |
          npx cdk destroy "HanamaskPreviewStack-pr-${PR_NUMBER}" --force \
            -c prNumber="${PR_NUMBER}" \
            -c vpcId="${{ steps.shared.outputs.vpcId }}" \
            -c isolatedSubnetIds="${{ steps.shared.outputs.subnets }}" \
            -c availabilityZones="${{ steps.shared.outputs.azs }}" \
            -c previewLambdaSgId="${{ steps.shared.outputs.sgId }}" \
            -c dbEndpoint="${{ steps.shared.outputs.dbEndpoint }}" \
            -c dbSecretArn="${{ steps.shared.outputs.dbSecretArn }}" \
            -c previewCertArn="${{ steps.shared.outputs.certArn }}"
