name: Deploy

# AWSへの本番デプロイ（docs/CICD.md §5、docs/AWS.md）。
# 認証はGitHub OIDC（WorkManagerGithubDeployStackのロールをAssume。静的キー不使用）。
# 事前準備（管理者・初回のみ）:
#   1. infra/ で WorkManagerGithubDeployStack をローカルからデプロイ
#   2. リポジトリ変数 AWS_DEPLOY_ROLE_ARN にロールARNを設定
#   3. production Environment に Required reviewers を設定（承認ゲート。docs/CICD.md §6）

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先環境（例: production, staging）"
        required: true
        type: string
        default: production

permissions:
  contents: read
  id-token: write # OIDCトークン取得（AssumeRoleWithWebIdentity）に必要

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # 本番デプロイもテスト済みのコードのみを配布するため再実行する（docs/CICD.md §5）
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build frontend (static export)
        run: npm run build

      - name: Build API Lambda bundle
        run: npm run build:lambda

      - name: Build migration Lambda bundle
        run: npm run build:migrate

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy WorkManagerDomainStack WorkManagerWebAppStack --require-approval never

      - name: Run database migrations (Lambda)
        run: |
          set -euo pipefail
          RESPONSE=$(aws lambda invoke \
            --function-name work-manager-migrate \
            --cli-read-timeout 350 \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            migrate-output.json)
          echo "$RESPONSE"
          echo "--- migration output ---"
          cat migrate-output.json
          echo ""
          if echo "$RESPONSE" | grep -q "FunctionError"; then
            echo "::error::DBマイグレーションに失敗しました"
            exit 1
          fi

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name WorkManagerWebAppStack \
            --query "Stacks[0].Outputs" \
            --output table
