name: Release

# タグを打つとWindowsインストーラーをビルドしてGitHub Releasesに添付する。
# 手元のWindowsで手動ビルドしていると、誰がどのコミットから作ったかが残らない。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（例: v0.2.0）。既に存在するタグを指定する。"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    # better-sqlite3 のネイティブビルドに Visual Studio Build Tools が要る。
    # Linuxからのクロスコンパイルは node-gyp が非対応（docs/PACKAGING.md）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # リリース物はテストが通ったコミットからしか作らない。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # ${{ }} を run: の中へ直接展開すると、入力値がシェルとして解釈される
      # （yaml.github-actions.security.run-shell-injection）。env経由で渡す。
      - name: package.json のバージョンとタグが一致することを確認する
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "タグ ($tag) と package.json のバージョン ($version) が一致しない。" >&2
            echo "package.json を先に更新してからタグを打つこと。" >&2
            exit 1
          fi

      # --publish never を明示する。electron-builder.yml に publish 設定があるため、
      # CI上でタグを検出すると electron-builder 自身がアップロードを試みる。
      # 添付は後段の gh CLI に一本化し、経路を2つ持たない。
      - name: Build installer
        run: npm run package:win -- --publish never

      - name: 成果物を確認する
        shell: bash
        run: ls -lh release/

      - name: リリースノートを組み立てる
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## 使いはじめる

          **必要なのは2つだけ。**Node.jsもソースコードも要りません。

          ### 1. 入れる

          下の `hanamask-Setup-*.exe` をダウンロードして実行してください。

          > **このインストーラーには署名を付けていません。**
          > 実行すると「WindowsによってPCが保護されました」という青い画面が出ます。
          > **「詳細情報」→「実行」** と進めてください。判断の経緯は `docs/SIGNING.md` にまとめています。

          ### 2. AIエージェントをつなぐ

          hanamask を起動した状態で、次を実行してください。

          ```bash
          claude mcp add --transport http hanamask http://127.0.0.1:39217/mcp
          ```

          `claude mcp list` に `✔ Connected` と出れば繋がっています。あとは普段どおり
          「今日調べたことをノートにまとめて」のように話しかけるだけです。
          **エージェントが書いた内容は、開いている画面へ手動リロードなしで現れます。**

          > **hanamask を起動していない間は繋がりません。**MCPサーバーはアプリの中で
          > 動いているため、アプリを閉じるとエージェントからも見えなくなります。

          ---

          データは `%APPDATA%\hanamask\` に保存され、アンインストールしても消えません。
          設定画面から書き出しておくと、別のPCへ移せます。

          **自動更新の仕組みはまだありません。**新しい版が出ていないかは、このページで確認してください。
          EOF

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          fi
          # latest.yml は publish 設定がある場合のみ生成される（自動更新用）。
          # 無い場合にリリース全体を失敗させたくないので、存在するものだけ渡す。
          assets=()
          for f in release/*.exe release/*.blockmap release/latest.yml; do
            [ -e "$f" ] && assets+=("$f")
          done
          printf '添付する成果物: %s\n' "${assets[@]}"
          gh release upload "$tag" --clobber "${assets[@]}"
