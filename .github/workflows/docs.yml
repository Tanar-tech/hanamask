name: Docs

# ci.yml は docs/** を除外しているため、ドキュメントだけのPRではチェックが1つも
# 走らない。同期漏れを捕まえたいのはまさにそのPRなので、専用に用意する。
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      # 検査そのものを変えたPRでも動かす。さもないと壊れたまま入っても気付けない。
      - "scripts/check-docs-sync.sh"
      - "scripts/check-task-status.mjs"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # マージベースとの差分を取るため全履歴が要る。
          fetch-depth: 0

      # ${{ }} を run: に直接展開しない（run-shell-injection）。env経由で渡す。
      - name: docs と docs/html の同期を確認する
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-docs-sync.sh "origin/$BASE_REF"

      # 完了したのに「実装中」のまま残る漏れを今日だけで3回起こしている。
      # 完了かどうかは機械には分からないので、件数で棚卸しを促すに留める。
      - name: docs/TASKS.md のステータスを確認する
        run: node scripts/check-task-status.mjs
