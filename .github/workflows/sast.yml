name: SAST

# ci.yml と同じ理由で paths-ignore を外している（2026-08-18）。semgrep はブランチ保護の
# 必須チェックに入っているため、除外されたPRは永久に条件が揃わずマージできなくなる。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OWASP Top 10（必須）+ ハードコードされたシークレットの検出（docs/CICD.md §6.1参照）。
      # Semgrep OSS CLIはOSS/無料で、semgrep.dev（AppSec Platform）へのログイン・トークンは
      # 使用しない。GitHub Advanced Security（有料）にも依存せず、結果はジョブログにのみ出力する。
      - name: Semgrep scan (OWASP Top 10 + secrets)
        run: semgrep scan --config p/owasp-top-ten --config p/secrets --error
